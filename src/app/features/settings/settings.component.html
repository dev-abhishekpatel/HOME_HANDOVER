<section class="page-block">
  <header class="section-head mb-4 p-4 bg-white rounded-4 shadow-sm border">
    <p class="eyebrow text-primary font-weight-bold mb-1">Configuration</p>
    <h2 class="fw-bold m-0 text-dark">Household & User Settings</h2>
  </header>

  <div class="row g-4">
    <!-- User Profile Settings -->
    <div class="col-lg-6">
      <div class="card border-0 rounded-4 shadow-sm p-4 bg-white">
        <h4 class="fw-bold mb-3">User Profile</h4>

        <form (ngSubmit)="saveProfile()">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Display Name</label>
            <input type="text" class="form-control custom-input" [(ngModel)]="userName" name="userName" required />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Email Address</label>
            <input type="email" class="form-control custom-input" [(ngModel)]="userEmail" name="userEmail" required />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Phone Number</label>
            <input type="text" class="form-control custom-input" [(ngModel)]="userPhone" name="userPhone" />
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Household Name</label>
            <input type="text" class="form-control custom-input" [(ngModel)]="householdName" name="householdName" />
          </div>

          <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
            <i class="bi bi-save me-1"></i> Save Profile
          </button>
        </form>
      </div>
    </div>

    <!-- App Preferences -->
    <div class="col-lg-6">
      <div class="card border-0 rounded-4 shadow-sm p-4 bg-white">
        <h4 class="fw-bold mb-3">Notification & System Preferences</h4>

        <form (ngSubmit)="savePreferences()">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Quiet Hours Window</label>
            <input type="text" class="form-control custom-input" [(ngModel)]="quietHours" name="quietHours" />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Reminder Channels</label>
            <select class="form-select custom-input" [(ngModel)]="reminderType" name="reminderType">
              <option value="Push + Email">Push Notifications + Email</option>
              <option value="Push Only">Push Notifications Only</option>
              <option value="Email Only">Email Only</option>
            </select>
          </div>

          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" role="switch" id="carryover" [(ngModel)]="taskCarryover" name="taskCarryover" />
            <label class="form-check-label fw-semibold text-dark" for="carryover">Automatic Task Carryover (Move incomplete tasks to next day)</label>
          </div>

          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" role="switch" id="visibility" [(ngModel)]="familyVisibility" name="familyVisibility" />
            <label class="form-check-label fw-semibold text-dark" for="visibility">Shared Household Task Visibility</label>
          </div>

          <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">
            <i class="bi bi-check-lg me-1"></i> Save Preferences
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
